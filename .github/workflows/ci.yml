name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lsp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.1

      - name: Install server dependencies
        run: opam install . --deps-only --with-test -y

      - name: Check OCaml formatting
        run: node ../../tools/scripts/check-ocamlformat.mjs

      - name: Run server smoke and stability tests
        run: opam exec -- dune build @runtest-smoke @runtest-stability

  extension-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/vscode-extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install extension dependencies
        run: npm ci

      - name: Lint extension
        run: npm run lint

      - name: Check extension formatting
        run: npm run format:check

      - name: Typecheck extension and tests
        run: npm run check

      - name: Compile extension
        run: npm run compile

      - name: Run extension unit tests
        run: npm run test:unit

      - name: Run extension integration tests
        run: npm run test:integration
