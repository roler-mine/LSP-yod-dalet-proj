name: Release VSIX

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-server-win-x64:
    name: Build Server (win32-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.1

      - name: Install server dependencies
        working-directory: apps/lsp-server
        run: opam install . --deps-only -y

      - name: Build server binary
        run: node .\tools\scripts\build-server.js --target win32-x64 --out .\dist\win32-x64\jovial-lsp.exe

      - name: Upload server artifact (win32-x64)
        uses: actions/upload-artifact@v4
        with:
          name: server-win32-x64
          path: dist/win32-x64/jovial-lsp.exe
          if-no-files-found: error

  build-server-win-arm64:
    name: Build Server (win32-arm64)
    runs-on: [self-hosted, Windows, ARM64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: 5.1.1

      - name: Install server dependencies
        working-directory: apps/lsp-server
        run: opam install . --deps-only -y

      - name: Build server binary
        run: node .\tools\scripts\build-server.js --target win32-arm64 --out .\dist\win32-arm64\jovial-lsp.exe

      - name: Upload server artifact (win32-arm64)
        uses: actions/upload-artifact@v4
        with:
          name: server-win32-arm64
          path: dist/win32-arm64/jovial-lsp.exe
          if-no-files-found: error

  package-vsix:
    name: Package Universal VSIX
    needs: [build-server-win-x64, build-server-win-arm64]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/vscode-extension/package-lock.json

      - name: Install extension dependencies
        working-directory: apps/vscode-extension
        run: npm ci

      - name: Download win32-x64 server
        uses: actions/download-artifact@v4
        with:
          name: server-win32-x64
          path: apps/vscode-extension/runtime/server/win32-x64

      - name: Download win32-arm64 server
        uses: actions/download-artifact@v4
        with:
          name: server-win32-arm64
          path: apps/vscode-extension/runtime/server/win32-arm64

      - name: Package VSIX
        run: npm --prefix .\apps\vscode-extension run package:vsix:release

      - name: Generate SHA256 checksums
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path .\dist | Out-Null
          $vsix = Get-ChildItem -Path .\apps\vscode-extension -Filter *.vsix -File | Select-Object -First 1
          if (-not $vsix) { throw "VSIX file was not produced." }
          certutil -hashfile $vsix.FullName SHA256 > .\dist\vsix.sha256.txt
          certutil -hashfile .\apps\vscode-extension\runtime\server\win32-x64\jovial-lsp.exe SHA256 > .\dist\server-win32-x64.sha256.txt
          certutil -hashfile .\apps\vscode-extension\runtime\server\win32-arm64\jovial-lsp.exe SHA256 > .\dist\server-win32-arm64.sha256.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jovial-vsix-release
          path: |
            apps/vscode-extension/*.vsix
            dist/*.sha256.txt
          if-no-files-found: error
